spring.datasource.url=jdbc:mysql://mysql:3306/smart_freelance_payment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

eureka.client.service-url.defaultZone=http://eureka:8761/eureka

# Downstream services (call via gateway inside the Docker network)
app.services.subscription.base-url=http://api-gateway:8080

# Mail (dev default: MailHog)
spring.mail.host=mailhog
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Keycloak (JWT validation)
# Keep issuer aligned with tokens issued for the browser (Angular uses https://localhost:8443).
# Fetch JWKS over HTTP via the host-mapped Keycloak port to avoid TLS trust issues in Java.
app.keycloak.issuer=https://localhost:8443/realms/smart-platform
app.keycloak.jwk-set-uri=http://host.docker.internal:8081/realms/smart-platform/protocol/openid-connect/certs

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
