server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # config-repo is at workspace root; config-server runs from its own folder
          search-locations: file:../config-repo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
